<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Algebra Quiz - StudyZone</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50">

<header class="bg-white/80 backdrop-blur-sm border-b sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <a href="index.html" class="flex items-center gap-3 hover:opacity-80 transition">
        <i data-lucide="book-open" class="w-8 h-8 text-blue-600"></i>
        <h1 class="text-2xl font-bold">StudyZone</h1>
      </a>
    </div>

    <nav class="hidden md:flex gap-8 items-center">
      <a href="research.html" class="font-medium text-gray-700 hover:text-blue-600">Research</a>
      <a href="textbooks.html" class="font-medium text-gray-700 hover:text-blue-600">Textbooks</a>
      <a href="about.html" class="font-medium text-gray-700 hover:text-blue-600">About</a>
      <a href="contact.html" class="font-medium text-gray-700 hover:text-blue-600">Contact Us</a>
      <a href="account.html" class="p-2 hover:bg-gray-100 rounded-lg transition" title="My Account">
        <i data-lucide="user-circle" class="w-6 h-6 text-gray-700"></i>
      </a>
      <button class="p-2 dark-mode-toggle">
        <i data-lucide="moon" class="w-5 h-5 dark-mode-icon"></i>
      </button>
    </nav>

    <div class="md:hidden flex items-center gap-2">
      <button class="p-2 dark-mode-toggle">
        <i data-lucide="moon" class="w-5 h-5 dark-mode-icon"></i>
      </button>
      <button id="menuBtn" class="p-2">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </div>
  </div>

  <div id="mobileMenu" class="hidden md:hidden border-t px-4 py-4 bg-white">
    <a href="research.html" class="block py-2 font-medium text-gray-700 hover:text-blue-600">Research</a>
    <a href="textbooks.html" class="block py-2 font-medium text-gray-700 hover:text-blue-600">Textbooks</a>
    <a href="about.html" class="block py-2 font-medium text-gray-700 hover:text-blue-600">About</a>
    <a href="contact.html" class="block py-2 font-medium text-gray-700 hover:text-blue-600">Contact Us</a>
    <a href="account.html" class="block py-2 font-medium text-gray-700 hover:text-blue-600">My Account</a>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-12">
  <div class="text-center mb-12">
    <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-r from-green-500 to-emerald-500 rounded-full mb-6">
      <i data-lucide="function-square" class="w-10 h-10 text-white"></i>
    </div>
    <h1 class="text-4xl md:text-5xl font-bold mb-4 text-gray-800">Algebra Quiz</h1>
    <p class="text-xl text-gray-600">Test your knowledge of algebraic expressions, equations, and functions</p>
  </div>

  <!-- Quiz Container -->
  <div id="quizContainer" class="space-y-8">
    <!-- Questions will be dynamically generated here -->
  </div>

  <!-- Submit Button -->
  <div class="mt-12 text-center">
    <button id="submitQuiz" class="px-8 py-4 bg-green-600 text-white text-lg font-semibold rounded-lg hover:bg-green-700 transition flex items-center gap-2 mx-auto">
      <i data-lucide="check-circle" class="w-6 h-6"></i>
      Submit Quiz
    </button>
  </div>

  <!-- Results Section -->
  <div id="quizResults" class="hidden mt-12 bg-white rounded-xl shadow-lg p-8 border-l-4 border-green-500">
    <h2 class="text-3xl font-bold mb-6 text-gray-800 text-center">Quiz Results</h2>
    <div id="scoreDisplay" class="text-center mb-8"></div>
    <div class="flex justify-center gap-4 flex-wrap">
      <a href="algebra-analysis.html" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2">
        <i data-lucide="book-open" class="w-5 h-5"></i>
        Review Material
      </a>
      <button onclick="location.reload()" class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition flex items-center gap-2">
        <i data-lucide="refresh-cw" class="w-5 h-5"></i>
        Retake Quiz
      </button>
    </div>
  </div>

  <!-- Navigation Buttons -->
  <div class="mt-12 flex justify-center gap-4 flex-wrap">
    <a href="algebra.html" class="px-6 py-3 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2">
      <i data-lucide="book-open" class="w-5 h-5"></i>
      Back to Algebra
    </a>
    <a href="more-subjects.html" class="px-6 py-3 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition flex items-center gap-2">
      <i data-lucide="arrow-left" class="w-5 h-5"></i>
      Back to Subjects
    </a>
  </div>
</main>

<footer class="bg-gray-900 text-white py-10 text-center mt-16">
  <p class="text-gray-400">© 2026 StudyZone. All rights reserved.</p>
</footer>

<script>
  lucide.createIcons();
  
  const menuBtn = document.getElementById("menuBtn");
  const mobileMenu = document.getElementById("mobileMenu");
  
  if (menuBtn && mobileMenu) {
    menuBtn.addEventListener("click", () => {
      mobileMenu.classList.toggle("hidden");
    });
  }

  // Question Bank - 40 questions total
  const questionBank = [
    {
      question: "Solve for x: 2x + 5 = 15",
      options: ["x = 4", "x = 5", "x = 6", "x = 7", "x = 10"],
      correct: 1,
      explanation: "Subtract 5 from both sides: 2x = 10. Divide both sides by 2: x = 5."
    },
    {
      question: "Solve for y: 3y - 7 = 14",
      options: ["y = 3", "y = 5", "y = 7", "y = 9", "y = 21"],
      correct: 2,
      explanation: "Add 7 to both sides: 3y = 21. Divide both sides by 3: y = 7."
    },
    {
      question: "Solve for x: 4x + 3 = 2x + 11",
      options: ["x = 2", "x = 3", "x = 4", "x = 5", "x = 7"],
      correct: 2,
      explanation: "Subtract 2x from both sides: 2x + 3 = 11. Subtract 3 from both sides: 2x = 8. Divide by 2: x = 4."
    },
    {
      question: "Solve the system: x + y = 10 and x - y = 4",
      options: ["x=6, y=4", "x=7, y=3", "x=8, y=2", "x=5, y=5", "x=9, y=1"],
      correct: 1,
      explanation: "Add the equations: 2x = 14, so x = 7. Substitute into first equation: 7 + y = 10, so y = 3."
    },
    {
      question: "Solve the system: 2x + y = 12 and x + y = 7",
      options: ["x=4, y=3", "x=5, y=2", "x=3, y=4", "x=6, y=1", "x=2, y=5"],
      correct: 1,
      explanation: "Subtract second from first: x = 5. Substitute into second equation: 5 + y = 7, so y = 2."
    },
    {
      question: "Factor: x² + 5x + 6",
      options: ["(x + 2)(x + 3)", "(x + 1)(x + 6)", "(x - 2)(x - 3)", "(x + 4)(x + 2)", "(x - 1)(x - 6)"],
      correct: 0,
      explanation: "Find two numbers that multiply to 6 and add to 5: 2 and 3. So x² + 5x + 6 = (x + 2)(x + 3)."
    },
    {
      question: "Factor: x² - 7x + 12",
      options: ["(x - 3)(x - 4)", "(x - 2)(x - 6)", "(x + 3)(x + 4)", "(x - 1)(x - 12)", "(x + 2)(x + 6)"],
      correct: 0,
      explanation: "Find two numbers that multiply to 12 and add to -7: -3 and -4. So x² - 7x + 12 = (x - 3)(x - 4)."
    },
    {
      question: "Factor: x² - 9",
      options: ["(x - 3)(x + 3)", "(x - 9)(x + 1)", "(x + 9)(x - 1)", "Cannot be factored", "(x - 3)²"],
      correct: 0,
      explanation: "This is a difference of squares: a² - b² = (a - b)(a + b). So x² - 9 = x² - 3² = (x - 3)(x + 3)."
    },
    {
      question: "Solve using the quadratic formula: x² + 6x + 5 = 0",
      options: ["x = -1 or x = -5", "x = 1 or x = 5", "x = -2 or x = -3", "x = 2 or x = 3", "x = -1 or x = 5"],
      correct: 0,
      explanation: "Using the quadratic formula x = (-b ± √(b²-4ac))/2a with a=1, b=6, c=5: x = (-6 ± √(36-20))/2 = (-6 ± 4)/2, giving x = -1 or x = -5."
    },
    {
      question: "Solve: x² - 4x - 12 = 0",
      options: ["x = 2 or x = -6", "x = 6 or x = -2", "x = 3 or x = -4", "x = 4 or x = -3", "x = -6 or x = 2"],
      correct: 1,
      explanation: "Factor: (x - 6)(x + 2) = 0. Set each factor to zero: x = 6 or x = -2."
    },
    {
      question: "What is the slope of the line y = 3x + 4?",
      options: ["3", "4", "7", "-3", "1/3"],
      correct: 0,
      explanation: "In the slope-intercept form y = mx + b, m is the slope. Here, the slope is 3."
    },
    {
      question: "What is the y-intercept of y = -2x + 7?",
      options: ["-2", "2", "7", "-7", "9"],
      correct: 2,
      explanation: "In the slope-intercept form y = mx + b, b is the y-intercept. Here, the y-intercept is 7."
    },
    {
      question: "Find the slope between points (2, 5) and (6, 13):",
      options: ["1", "2", "3", "4", "8"],
      correct: 1,
      explanation: "Slope = (y₂ - y₁)/(x₂ - x₁) = (13 - 5)/(6 - 2) = 8/4 = 2."
    },
    {
      question: "Write the equation of a line with slope 4 and y-intercept -3:",
      options: ["y = 4x - 3", "y = -3x + 4", "y = 4x + 3", "y = 3x - 4", "y = -4x + 3"],
      correct: 0,
      explanation: "Using y = mx + b where m = 4 and b = -3, the equation is y = 4x - 3."
    },
    {
      question: "If f(x) = 2x + 5, what is f(3)?",
      options: ["8", "9", "10", "11", "13"],
      correct: 3,
      explanation: "Substitute x = 3 into the function: f(3) = 2(3) + 5 = 6 + 5 = 11."
    },
    {
      question: "If g(x) = x² - 4, what is g(-2)?",
      options: ["-8", "-4", "0", "4", "8"],
      correct: 2,
      explanation: "Substitute x = -2 into the function: g(-2) = (-2)² - 4 = 4 - 4 = 0."
    },
    {
      question: "If h(x) = 3x - 1, find h(0):",
      options: ["-3", "-1", "0", "1", "3"],
      correct: 1,
      explanation: "Substitute x = 0 into the function: h(0) = 3(0) - 1 = -1."
    },
    {
      question: "Simplify: x³ × x⁵",
      options: ["x⁸", "x¹⁵", "x²", "2x⁸", "x⁻²"],
      correct: 0,
      explanation: "When multiplying powers with the same base, add exponents: x³ × x⁵ = x⁸."
    },
    {
      question: "Simplify: (x⁴)³",
      options: ["x⁷", "x¹²", "x⁶⁴", "3x⁴", "x"],
      correct: 1,
      explanation: "When raising a power to a power, multiply exponents: (x⁴)³ = x¹²."
    },
    {
      question: "Simplify: x⁷ ÷ x³",
      options: ["x⁴", "x¹⁰", "x²¹", "x", "x⁻⁴"],
      correct: 0,
      explanation: "When dividing powers with the same base, subtract exponents: x⁷ ÷ x³ = x⁴."
    },
    {
      question: "Simplify: (2x³)²",
      options: ["2x⁵", "2x⁶", "4x⁵", "4x⁶", "8x⁶"],
      correct: 3,
      explanation: "Apply the exponent to both the coefficient and variable: (2x³)² = 2² × (x³)² = 4x⁶."
    },
    {
      question: "Simplify: √(16x⁴)",
      options: ["4x²", "4x⁴", "8x²", "2x²", "16x²"],
      correct: 0,
      explanation: "Take the square root of each part: √16 = 4 and √(x⁴) = x². So √(16x⁴) = 4x²."
    },
    {
      question: "Simplify: √(25x⁶)",
      options: ["5x²", "5x³", "25x³", "5x⁶", "√25x³"],
      correct: 1,
      explanation: "Take the square root of each part: √25 = 5 and √(x⁶) = x³. So √(25x⁶) = 5x³."
    },
    {
      question: "Simplify: 2√8",
      options: ["4√2", "2√2", "√16", "16", "8√2"],
      correct: 0,
      explanation: "Simplify √8 = √(4×2) = 2√2. Then 2√8 = 2(2√2) = 4√2."
    },
    {
      question: "Solve the inequality: 2x + 3 > 11",
      options: ["x > 4", "x > 7", "x < 4", "x > 14", "x > 8"],
      correct: 0,
      explanation: "Subtract 3 from both sides: 2x > 8. Divide both sides by 2: x > 4."
    },
    {
      question: "Solve the inequality: -3x ≤ 12",
      options: ["x ≤ -4", "x ≥ -4", "x ≤ 4", "x ≥ 4", "x ≤ -36"],
      correct: 1,
      explanation: "Divide both sides by -3, which flips the inequality sign: x ≥ -4."
    },
    {
      question: "Solve: 5x - 7 < 3x + 5",
      options: ["x < 6", "x > 6", "x < -6", "x < 12", "x > -6"],
      correct: 0,
      explanation: "Subtract 3x from both sides: 2x - 7 < 5. Add 7 to both sides: 2x < 12. Divide by 2: x < 6."
    },
    {
      question: "A number increased by 8 equals 20. Find the number.",
      options: ["8", "10", "12", "14", "28"],
      correct: 2,
      explanation: "Let x be the number. Equation: x + 8 = 20. Solve: x = 20 - 8 = 12."
    },
    {
      question: "Three times a number minus 5 equals 16. Find the number.",
      options: ["5", "6", "7", "8", "21"],
      correct: 2,
      explanation: "Let x be the number. Equation: 3x - 5 = 16. Add 5: 3x = 21. Divide by 3: x = 7."
    },
    {
      question: "Two consecutive integers sum to 35. Find the smaller integer.",
      options: ["16", "17", "18", "19", "20"],
      correct: 1,
      explanation: "Let x be the smaller integer. Equation: x + (x+1) = 35. Simplify: 2x + 1 = 35. Solve: 2x = 34, x = 17."
    },
    {
      question: "Expand: 3(x + 4)",
      options: ["3x + 4", "3x + 12", "x + 12", "3x + 7", "12x"],
      correct: 1,
      explanation: "Use the distributive property: 3(x + 4) = 3·x + 3·4 = 3x + 12."
    },
    {
      question: "Expand: -2(3x - 5)",
      options: ["-6x - 10", "-6x + 10", "-6x - 5", "6x + 10", "-5x - 10"],
      correct: 1,
      explanation: "Use the distributive property: -2(3x - 5) = -2·3x + (-2)·(-5) = -6x + 10."
    },
    {
      question: "Simplify: 5x + 3x - 2x",
      options: ["6x", "10x", "8x", "0", "x"],
      correct: 0,
      explanation: "Combine like terms: (5 + 3 - 2)x = 6x."
    },
    {
      question: "Simplify: 4a + 3b - 2a + 5b",
      options: ["2a + 8b", "6a + 8b", "2a + 2b", "6a + 2b", "2a + 5b"],
      correct: 0,
      explanation: "Combine like terms: (4a - 2a) + (3b + 5b) = 2a + 8b."
    },
    {
      question: "What is the slope of a horizontal line?",
      options: ["0", "1", "Undefined", "-1", "Infinity"],
      correct: 0,
      explanation: "A horizontal line has no vertical change (rise = 0), so slope = rise/run = 0/run = 0."
    },
    {
      question: "What is the slope of a vertical line?",
      options: ["0", "1", "Undefined", "-1", "Infinity"],
      correct: 2,
      explanation: "A vertical line has no horizontal change (run = 0), so slope = rise/0, which is undefined."
    },
    {
      question: "Evaluate: 3x² when x = 4",
      options: ["24", "36", "48", "64", "144"],
      correct: 2,
      explanation: "Substitute x = 4: 3(4)² = 3(16) = 48."
    },
    {
      question: "If y varies directly with x, and y = 12 when x = 3, find y when x = 7:",
      options: ["21", "24", "28", "35", "36"],
      correct: 2,
      explanation: "Direct variation: y = kx. Find k: 12 = k(3), so k = 4. When x = 7: y = 4(7) = 28."
    },
    {
      question: "Solve: |x| = 8",
      options: ["x = 8 only", "x = -8 only", "x = 8 or x = -8", "x = 0", "No solution"],
      correct: 2,
      explanation: "The absolute value equation |x| = 8 has two solutions: x = 8 or x = -8, since both have absolute value 8."
    },
    {
      question: "What is the value of x⁰ (assuming x ≠ 0)?",
      options: ["0", "1", "x", "Undefined", "∞"],
      correct: 1,
      explanation: "Any non-zero number raised to the power of 0 equals 1. Therefore, x⁰ = 1."
    }
  ];

  // Shuffle array function
  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  // Select 15 random questions
  const selectedQuestions = shuffleArray(questionBank).slice(0, 15);
  const correctAnswers = {};
  const explanations = {};

  // Generate quiz HTML
  const quizContainer = document.getElementById('quizContainer');
  selectedQuestions.forEach((q, index) => {
    const questionNum = index + 1;
    const questionId = `q${questionNum}`;
    
    // Store correct answer and explanation
    correctAnswers[questionId] = q.correct;
    explanations[questionId] = q.explanation;
    
    // Shuffle options with correct answer tracking
    const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
    const shuffledOptions = shuffleArray(optionsWithIndex);
    
    // Find new position of correct answer
    const newCorrectIndex = shuffledOptions.findIndex(opt => opt.originalIndex === q.correct);
    correctAnswers[questionId] = newCorrectIndex;
    
    // Create question HTML
    const questionHTML = `
      <div class="bg-white rounded-xl shadow-lg p-8 border-l-4 border-green-500 quiz-question">
        <h3 class="text-2xl font-bold mb-4 text-gray-800">Question ${questionNum}</h3>
        <p class="text-lg text-gray-700 mb-6">${q.question}</p>
        <div class="space-y-3">
          ${shuffledOptions.map((opt, optIndex) => `
            <label class="flex items-start gap-3 p-4 rounded-lg hover:bg-gray-50 cursor-pointer transition">
              <input type="radio" name="${questionId}" value="${optIndex}" class="mt-1">
              <span class="text-gray-700">${opt.text}</span>
            </label>
          `).join('')}
        </div>
        <div class="feedback mt-4 hidden"></div>
      </div>
    `;
    
    quizContainer.innerHTML += questionHTML;
  });

  lucide.createIcons();

  // Submit button handler
  document.getElementById('submitQuiz').addEventListener('click', () => {
    let score = 0;
    let answered = 0;
    
    const questions = document.querySelectorAll('.quiz-question');
    
    questions.forEach((question, index) => {
      const questionId = `q${index + 1}`;
      const selected = question.querySelector(`input[name="${questionId}"]:checked`);
      const feedback = question.querySelector('.feedback');
      
      if (selected) {
        answered++;
        const selectedValue = parseInt(selected.value);
        const isCorrect = selectedValue === correctAnswers[questionId];
        
        if (isCorrect) {
          score++;
          question.classList.remove('border-red-500', 'border-emerald-500');
          question.classList.add('border-green-500');
          feedback.innerHTML = `
            <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded">
              <p class="font-semibold text-green-800 mb-2">✓ Correct!</p>
              <p class="text-green-700">${explanations[questionId]}</p>
            </div>
          `;
        } else {
          question.classList.remove('border-green-500', 'border-emerald-500');
          question.classList.add('border-red-500');
          feedback.innerHTML = `
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded">
              <p class="font-semibold text-red-800 mb-2">✗ Incorrect</p>
              <p class="text-red-700">${explanations[questionId]}</p>
            </div>
          `;
        }
        
        feedback.classList.remove('hidden');
      } else {
        question.classList.remove('border-green-500', 'border-red-500');
        question.classList.add('border-emerald-500');
        feedback.innerHTML = `
          <div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded">
            <p class="font-semibold text-yellow-800">Question not answered</p>
          </div>
        `;
        feedback.classList.remove('hidden');
      }
    });

    // Calculate percentage
    const percentage = answered > 0 ? Math.round((score / 15) * 100) : 0;
    
    // Display score
    let resultColor = percentage >= 70 ? 'text-green-600' : percentage >= 50 ? 'text-yellow-600' : 'text-red-600';
    let resultMessage = percentage >= 70 ? 'Excellent work!' : percentage >= 50 ? 'Good effort!' : 'Keep practicing!';
    
    document.getElementById('scoreDisplay').innerHTML = `
      <div class="text-6xl font-bold ${resultColor} mb-4">${score}/15</div>
      <div class="text-2xl font-semibold text-gray-700">${percentage}%</div>
      <div class="text-xl text-gray-600 mt-2">${resultMessage}</div>
    `;
    
    document.getElementById('quizResults').classList.remove('hidden');
    document.getElementById('quizResults').scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Dark Mode Toggle
  const darkModeToggles = document.querySelectorAll('.dark-mode-toggle');
  const darkModeIcons = document.querySelectorAll('.dark-mode-icon');

  const currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') {
    document.body.classList.add('dark-mode');
  }

  function updateDarkModeIcon() {
    const isDark = document.body.classList.contains('dark-mode');
    darkModeIcons.forEach(icon => {
      icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
    });
    lucide.createIcons();
  }

  // Initialize icons and dark mode
  lucide.createIcons();
  setTimeout(() => {
    updateDarkModeIcon();
  }, 100);

  darkModeToggles.forEach(toggle => {
    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      document.body.classList.toggle('dark-mode');
      const theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
      localStorage.setItem('theme', theme);
      updateDarkModeIcon();
    });
  });
</script>

</body>
</html>
