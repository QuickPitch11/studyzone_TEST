      explanation: "The three main anatomical planes are: (1) Sagittal plane - divides body into left and right portions; (2) Frontal/Coronal plane - divides body into anterior (front) and posterior (back) portions; (3) Transverse/Horizontal plane - divides body into superior (upper) and inferior (lower) portions. These planes are essential for describing anatomical structures and medical imaging."

      question: "What does the term 'superior' mean in anatomical terminology?",

      correct: 1,
      explanation: "Superior (or cranial) means toward the head or upper part of a structure. For example, the head is superior to the chest. The opposite term is inferior (or caudal), which means toward the feet or lower part. These directional terms are fundamental to describing anatomical positions and relationships."
    },
    {
      question: "How many bones are in the adult human skeleton?",

    {

      explanation: "The femur (thighbone) is classified as a long bone. Long bones are characterized by being longer than they are wide, having a shaft (diaphysis) and two ends (epiphyses), and containing a medullary cavity filled with bone marrow. Other examples include the humerus, tibia, and radius. Long bones primarily function in support and movement."
    },
    {
      question: "What are the four main types of tissues in the human body?",

      explanation: "The four main tissue types are: (1) Epithelial tissue - covers body surfaces and lines cavities; (2) Connective tissue - supports and binds other tissues (includes bone, blood, cartilage, adipose); (3) Muscle tissue - produces movement (skeletal, cardiac, smooth); (4) Nervous tissue - transmits electrical signals (neurons and supporting cells). All organs are composed of combinations of these four tissue types."

    },
    {

      explanation: "The sacrum is formed by the fusion of five sacral vertebrae (S1-S5). This fusion typically occurs during adolescence and early adulthood. The sacrum is a triangular bone located at the base of the spine, between the two hip bones (ilium), and forms the posterior wall of the pelvis. It articulates with L5 above and the coccyx below."
    },
    {
      question: "What are the three types of muscle tissue?",

      explanation: "The three types of muscle tissue are: (1) Skeletal muscle - striated, voluntary, attached to bones for movement; (2) Smooth muscle - non-striated, involuntary, found in walls of hollow organs and blood vessels; (3) Cardiac muscle - striated, involuntary, found only in the heart. Each type has unique structural and functional characteristics suited to its specific role."

    {

    },
    {

    },

    },
    {

    },

    },
    {

      explanation: "The myelin sheath is a fatty insulating layer that wraps around axons, formed by Schwann cells (PNS) or oligodendrocytes (CNS). It increases the speed of electrical signal transmission through saltatory conduction, where action potentials 'jump' between gaps in myelin (nodes of Ranvier). Myelinated axons conduct impulses up to 100 times faster than unmyelinated ones. Myelin damage causes diseases like multiple sclerosis."
    },

    },
    {

    },
    {
      question: "What is the largest artery in the human body?",

    },
    {

    },

    },

    },

    },

      options: ["An antibody-producing cell", "A substance that triggers an immune response", "A type of white blood cell", "A defensive protein in blood", "A pathogen-destroying enzyme"],
      correct: 1,
      explanation: "An antigen is any substance (usually a protein or polysaccharide) that triggers an immune response. Antigens can be parts of pathogens (bacteria, viruses), toxins, foreign cells (transfused blood, transplanted organs), or allergens. The immune system recognizes antigens as 'non-self,' leading to antibody production and/or T-cell activation. Specific regions on antigens called epitopes bind to antibodies or T-cell receptors."
    },
    {
      question: "What is the function of the lymphatic system?",
      options: ["Produce hormones", "Transport oxygen", "Return fluid to blood, absorb fats, and provide immune function", "Filter blood in kidneys", "Regulate body temperature"],
      correct: 2,
      explanation: "The lymphatic system has three main functions: (1) Fluid balance - returns excess interstitial fluid (lymph) to bloodstream, maintaining blood volume and pressure; (2) Fat absorption - lacteals in small intestine absorb dietary fats and fat-soluble vitamins; (3) Immune function - lymph nodes filter lymph, remove pathogens, house lymphocytes that mount immune responses. The system includes lymphatic vessels, lymph nodes, spleen, thymus, and tonsils."
    }
  ];

  // Shuffle array function
  function shuffleArray(array) {
    const shuffled = [...array];
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  // Select 15 random questions
  const selectedQuestions = shuffleArray(questionBank).slice(0, 15);
  const correctAnswers = {};
  const explanations = {};

  // Generate quiz HTML
  const quizContainer = document.getElementById('quizContainer');
  selectedQuestions.forEach((q, index) => {
    const questionNum = index + 1;
    const questionId = `q${questionNum}`;
    
    // Store correct answer and explanation
    correctAnswers[questionId] = q.correct;
    explanations[questionId] = q.explanation;
    
    // Shuffle options with correct answer tracking
    const optionsWithIndex = q.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
    const shuffledOptions = shuffleArray(optionsWithIndex);
    
    // Find new position of correct answer
    const newCorrectIndex = shuffledOptions.findIndex(opt => opt.originalIndex === q.correct);
    correctAnswers[questionId] = newCorrectIndex;
    
    // Create question HTML
    const questionHTML = `
      <div class="bg-white rounded-xl shadow-lg p-8 border-l-4 border-red-500 quiz-question">
        <h3 class="text-2xl font-bold mb-4 text-gray-800">Question ${questionNum}</h3>
        <p class="text-lg text-gray-700 mb-6">${q.question}</p>
        <div class="space-y-3">
          ${shuffledOptions.map((opt, optIndex) => `
            <label class="flex items-start gap-3 p-4 rounded-lg hover:bg-gray-50 cursor-pointer transition">
              <input type="radio" name="${questionId}" value="${optIndex}" class="mt-1">
              <span class="text-gray-700">${opt.text}</span>
            </label>
          `).join('')}
        </div>
        <div class="feedback mt-4 hidden"></div>
      </div>
    `;
    
    quizContainer.innerHTML += questionHTML;
  });

  lucide.createIcons();

  // Submit button handler
  document.getElementById('submitQuiz').addEventListener('click', () => {
    let score = 0;
    let answered = 0;
    
    const questions = document.querySelectorAll('.quiz-question');
    
    questions.forEach((question, index) => {
      const questionId = `q${index + 1}`;
      const selected = question.querySelector(`input[name="${questionId}"]:checked`);
      const feedback = question.querySelector('.feedback');
      
      if (selected) {
        answered++;
        const selectedValue = parseInt(selected.value);
        const isCorrect = selectedValue === correctAnswers[questionId];
        
        if (isCorrect) {
          score++;
          question.classList.remove('border-red-500', 'border-yellow-500');
          question.classList.add('border-green-500');
          feedback.innerHTML = `
            <div class="bg-green-50 border-l-4 border-green-500 p-4 rounded">
              <p class="font-semibold text-green-800 mb-2">✓ Correct!</p>
              <p class="text-green-700">${explanations[questionId]}</p>
            </div>
          `;
        } else {
          question.classList.remove('border-green-500', 'border-yellow-500');
          question.classList.add('border-red-500');
          feedback.innerHTML = `
            <div class="bg-red-50 border-l-4 border-red-500 p-4 rounded">
              <p class="font-semibold text-red-800 mb-2">✗ Incorrect</p>
              <p class="text-red-700">${explanations[questionId]}</p>
            </div>
          `;
        }
        
        feedback.classList.remove('hidden');
      } else {
        question.classList.remove('border-green-500', 'border-red-500');
        question.classList.add('border-yellow-500');
        feedback.innerHTML = `
          <div class="bg-yellow-50 border-l-4 border-yellow-500 p-4 rounded">
            <p class="font-semibold text-yellow-800">Question not answered</p>
          </div>
        `;
        feedback.classList.remove('hidden');
      }
    });
    
    const percentage = answered > 0 ? Math.round((score / 15) * 100) : 0;
    const resultDiv = document.getElementById('quizResults');
    const scoreDisplay = document.getElementById('scoreDisplay');
    
    let gradeColor = 'text-red-600';
    let message = 'Keep studying!';
    
    if (percentage >= 90) {
      gradeColor = 'text-green-600';
      message = 'Excellent! You have mastered this material!';
    } else if (percentage >= 80) {
      gradeColor = 'text-blue-600';
      message = 'Great job! You have a strong understanding!';
    } else if (percentage >= 70) {
      gradeColor = 'text-yellow-600';
      message = 'Good work! Review the explanations to improve.';
    } else if (percentage >= 60) {
      gradeColor = 'text-orange-600';
      message = 'Fair. Consider reviewing the material more thoroughly.';
    }
    
    scoreDisplay.innerHTML = `
      <div class="text-center">
        <div class="text-6xl font-bold ${gradeColor} mb-4">${percentage}%</div>
        <p class="text-2xl text-gray-700 mb-2">${score} out of 15 correct</p>
        <p class="text-xl text-gray-600 mb-6">${message}</p>
      </div>
    `;
    
    resultDiv.classList.remove('hidden');
    resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });

  // Dark Mode Toggle
  const darkModeToggles = document.querySelectorAll('.dark-mode-toggle');
  const darkModeIcons = document.querySelectorAll('.dark-mode-icon');

  const currentTheme = localStorage.getItem('theme') || 'light';
  if (currentTheme === 'dark') {
    document.body.classList.add('dark-mode');
  }

  function updateDarkModeIcon() {
    const isDark = document.body.classList.contains('dark-mode');
    darkModeIcons.forEach(icon => {
      icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
    });
    lucide.createIcons();
  }

  // Initialize icons and dark mode
  lucide.createIcons();
  setTimeout(() => {
    updateDarkModeIcon();
  }, 100);

  darkModeToggles.forEach(toggle => {
    toggle.addEventListener('click', (e) => {
      e.preventDefault();
      document.body.classList.toggle('dark-mode');
      const theme = document.body.classList.contains('dark-mode') ? 'dark' : 'light';
      localStorage.setItem('theme', theme);
      updateDarkModeIcon();
    });
  });
</script>

</body>
</html>
